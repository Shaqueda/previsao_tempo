<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsão do Tempo - Ceará (Ao Vivo)</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <div id="map" class="map-container"></div>
        
        <!-- Weather Effects Overlay -->
        <div id="weather-effects-overlay" class="weather-effects-overlay"></div>
        
        <!-- Painel de Detalhes da Cidade (Oculto por Padrão) -->
        <div id="city-details-panel" class="details-panel" style="display: none;">
            <button onclick="closeDetails()" class="close-btn">← Voltar ao Mapa</button>
            <h3 id="detail-city-name">Nome da Cidade</h3>
            <div class="detail-subtitle">Situação Atual</div>
            
            <div class="detail-main">
                <div id="detail-icon" class="detail-icon">☁️</div>
                <div class="detail-temp-box">
                    <span id="detail-temp">--°</span>
                    <span id="detail-desc">Nublado</span>
                </div>
            </div>

            <div class="detail-stats">
                <div class="stat-box">
                    <span class="stat-label">Chuva Acumulada (Hoje)</span>
                    <span id="detail-rain" class="stat-value">-- mm</span>
                </div>
            </div>
        </div>

        <!-- Painel Previsão 17h (Oculto por Padrão) -->
        <div id="forecast-17-panel" class="forecast-panel" style="display: none;">
            <div class="forecast-header">Resumo das 17h00</div>
            <div class="forecast-main">
                <div id="forecast-17-icon" class="forecast-icon">☀️</div>
                <div class="forecast-temp-box">
                    <span id="forecast-17-temp">--°</span>
                    <span id="forecast-17-desc">Ensolarado</span>
                </div>
            </div>
        </div>
        <!-- Configurações de API -->
        <button id="settings-trigger-btn" class="settings-trigger-btn" onclick="openSettingsModal()">⚙️</button>
        
        <div id="settings-modal" class="settings-modal" style="display: none;">
            <div class="modal-content">
                <h3>Configuração de API</h3>
                <p>Insira sua chave do <a href="https://www.weatherapi.com/" target="_blank" style="color: var(--accent-color);">WeatherAPI.com</a> para obter dados em tempo real.</p>
                <input type="password" id="api-key-input" placeholder="Cole sua API Key aqui..." />
                <div class="modal-actions">
                    <button class="save-btn" onclick="saveApiKey()">Salvar</button>
                    <button class="cancel-btn" onclick="closeSettingsModal()">Cancelar</button>
                </div>
            </div>
        </div>

        <div id="api-key-warning" class="api-key-warning" style="display: none;" onclick="openSettingsModal()">
            <span>⚠️ API Key necessária para tempo real. Clique aqui para configurar.</span>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
