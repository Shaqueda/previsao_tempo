<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsão do Tempo - Ceará (Ao Vivo)</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <div id="map" class="map-container"></div>
        
        <div class="sidebar">
            <h1>Tempo Agora</h1>
            <h2>Ceará</h2>
            
            <div id="default-sidebar-content" style="display: flex; flex-direction: column; height: 100%;">
                <div class="time-display" id="time-display">--:--</div>
                <div class="date-display" id="date-display">-- de --</div>
                <div style="margin-top: 20px; color: var(--text-secondary); font-size: 0.9rem; font-style: italic;">
                    *Clique em uma cidade no mapa para ver o resumo de hoje.
                </div>
            </div>

            <!-- Painel de Detalhes da Cidade (Oculto por Padrão) -->
            <div id="city-details-panel" class="details-panel" style="display: none;">
                <button onclick="closeDetails()" class="close-btn">← Voltar</button>
                <h3 id="detail-city-name">Nome da Cidade</h3>
                <div class="detail-subtitle">Resumo das 17h00</div>
                
                <div class="detail-main">
                    <div id="detail-icon" class="detail-icon">☁️</div>
                    <div class="detail-temp-box">
                        <span id="detail-temp">--°</span>
                        <span id="detail-desc">Nublado</span>
                    </div>
                </div>

                <div class="detail-stats">
                    <div class="stat-box">
                        <span class="stat-label">Chuva Acumulada (Hoje)</span>
                        <span id="detail-rain" class="stat-value">-- mm</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
